<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torn Atlas</title>
<meta name="description" content="Why the map looks the way it does. Short explainers on borders, straits, rivers and the strange geography behind the news.">
<link rel="icon" href="avatar.png">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,500&family=Instrument+Sans:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #DDD5C3; --ink: #141413; --sea: #447A84; --accent: #D9362C; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 19px/1.55 Newsreader, Georgia, serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 24px; }
  img { width: 112px; height: 112px; border-radius: 50%; }
  h1 { font-style: italic; font-weight: 500; font-size: 56px; letter-spacing: -0.025em; margin: 24px 0 8px; }
  .tag { font: 600 14px/1 "Instrument Sans", system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; border-bottom: 3px solid var(--accent); display: inline-block; padding-bottom: 6px; }
  a { color: var(--sea); }
  footer { margin-top: 48px; font-size: 15px; }
</style>
</head>
<body>
<main>
  <img src="avatar.png" alt="Torn Atlas logo">
  <h1>Torn Atlas</h1>
  <div class="tag">Why the map looks the way it does</div>
  <p>Short explainers on borders, straits, rivers and the strange geography behind the news, made as paper-style animated maps.</p>
  <p>Watch on YouTube: <a href="https://www.youtube.com/@tornatlasgeo">@tornatlasgeo</a></p>
  <footer><a href="privacy.html">Privacy policy</a> · <a href="terms.html">Terms</a></footer>
</main>
</body>
</html>
